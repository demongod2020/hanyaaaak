name: Bonchorok Docker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonchorok-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: bonchorok:ci
  CONTAINER_NAME: bonchorok-ci

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image and validate catalog loading
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          docker build --pull --build-arg GIT_SHA="$GITHUB_SHA" --tag "$LOCAL_IMAGE" . 2>&1 | tee artifacts/ci/build.log

      - name: Start container and wait for health check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8000:8000 "$LOCAL_IMAGE"
          for attempt in {1..30}; do
            state=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME")
            health=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")
            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              echo "::error::Container failed to start or became unhealthy"
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy within 60 seconds"
          exit 1

      - name: Test HTTP endpoints and public port
        run: |
          set -o pipefail
          docker exec "$CONTAINER_NAME" python smoke_test.py 2>&1 | tee artifacts/ci/smoke.log
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health | tee artifacts/ci/health.json

      # Pull requests (including forks) never receive Docker Hub credentials.
      - name: Validate publishing configuration
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to repository Actions secrets"
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::DOCKERHUB_USERNAME must be a Docker Hub username, not an email or URL"
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and push the exact image that passed the tests; do not rebuild it.
      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/bonchorok"
          for tag in "sha-$GITHUB_SHA" hw3 latest; do
            docker tag "$LOCAL_IMAGE" "$image:$tag"
            docker push "$image:$tag"
          done
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
          {
            echo '### Published Bonchorok image'
            echo "Image: $image:sha-$GITHUB_SHA"
            echo 'Additional tags: hw3, latest'
            echo 'Passed: build-time catalog validation, container health, HTTP smoke test.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print container logs
        if: always()
        run: |
          mkdir -p artifacts/ci
          docker logs "$CONTAINER_NAME" > artifacts/ci/container.log 2>&1 || true
          docker inspect "$CONTAINER_NAME" > artifacts/ci/container.json 2>&1 || true

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove test container
        if: always()
        run: docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
