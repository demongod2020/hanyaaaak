name: Bonchorok Local Deploy

on:
  workflow_run:
    workflows: [Bonchorok Docker CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bonchorok-local-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Never run pull-request code on the persistent local machine.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "{0}"
    steps:
      - name: Check out the successfully published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python for independent observation
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/deployment -Force | Out-Null
          $runtime = Join-Path $env:RUNNER_TOOL_CACHE 'PythonEmbed/3.12.10/x64'
          $archive = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
          try {
            Invoke-WebRequest -UseBasicParsing 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $archive
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
            if ($hash -ne '4ACBED6DD1C744B0376E3B1CF57CE906F9DC9E95E68824584C8099A63025A3C3') { throw 'Python runtime checksum mismatch' }
            New-Item -ItemType Directory -Path $runtime -Force | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
            $paths = "python312.zip`n.`n$env:GITHUB_WORKSPACE\ops`n"
            [IO.File]::WriteAllText((Join-Path $runtime 'python312._pth'), $paths, (New-Object Text.UTF8Encoding($false)))
            $runtime | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            & (Join-Path $runtime 'python.exe') -c "import ssl, subprocess, monitor, deploy; print('Python runtime imports OK')" | Out-File artifacts/deployment/runtime.log -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Python runtime import check failed' }
          } catch {
            $_ | Out-String | Out-File artifacts/deployment/runtime-failure.log -Encoding utf8
            throw
          }

      - name: Set up fixed browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser and initialize evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          npm.cmd ci --prefix ops/browser
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed' }
          & ops/browser/node_modules/.bin/playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }

      - name: Locate Docker and check Linux engine
        run: |
          $ErrorActionPreference = 'Stop'
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if (-not $docker) {
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\DockerDesktop\resources\bin\docker.exe",
              "$env:ProgramFiles\Docker\Docker\resources\bin\docker.exe"
            )
            $exe = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $exe) { throw 'Docker Desktop is not installed for this runner account.' }
            $bin = Split-Path $exe
            $env:PATH = "$bin;$env:PATH"
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          # Preserve the engine endpoint while isolating CI login credentials.
          $endpoint = $env:DOCKER_HOST
          if (-not $endpoint) {
            $endpoint = docker context inspect --format '{{.Endpoints.docker.Host}}'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Docker engine endpoint.' }
          }
          "DOCKER_HOST=$endpoint" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $config = Join-Path $env:RUNNER_TEMP "bonchorok-docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          "DOCKER_CONFIG=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $os = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os -ne 'linux') {
            throw 'Start Docker Desktop with the Linux engine under the runner account.'
          }

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy and verify the published image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DOCKERHUB_USERNAME -notmatch '^[a-z0-9][a-z0-9_-]*$') { throw 'Invalid Docker Hub username secret.' }
          if ($env:IMAGE_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Invalid published commit SHA.' }
          $image = "$env:DOCKERHUB_USERNAME/bonchorok:sha-$env:IMAGE_SHA"
          $env:PYTHONUTF8 = '1'
          python ops/validate_deploy.py --image $image --sha $env:IMAGE_SHA --out artifacts/deployment
          if ($LASTEXITCODE -ne 0) { throw 'Deployment failed.' }

      - name: Write one-screen validation summary
        if: always()
        run: |
          New-Item -ItemType Directory -Path artifacts/deployment -Force | Out-Null
          if (Test-Path artifacts/deployment/summary.md) {
            Get-Content artifacts/deployment/summary.md -Raw -Encoding UTF8 | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'Validation unavailable: execution stopped before evidence collection. No availability or performance claim is supported.' | Out-File artifacts/deployment/summary.md -Encoding utf8
            Get-Content artifacts/deployment/summary.md -Raw -Encoding UTF8 | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary registry credentials
        if: always()
        run: |
          if ($env:DOCKER_CONFIG -and (Test-Path -LiteralPath $env:DOCKER_CONFIG)) {
            $target = [IO.Path]::GetFullPath($env:DOCKER_CONFIG)
            $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            if (-not $target.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected credential directory.' }
            Remove-Item -LiteralPath $target -Recurse -Force
          }
